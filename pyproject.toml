[project]
name = "sovereign-engine"
version = "14.6.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["core"]
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line-length handled by line-length setting

[tool.ruff.lint.per-file-ignores]
"tests/test_data_provider.py" = ["E402"]
"tests/test_factors.py" = ["E402"]
"tests/test_indicators.py" = ["E402"]
"tests/test_regime.py" = ["E402"]
"tests/test_scorer_portfolio.py" = ["E402"]
"tests/test_signal_enhancements.py" = ["E402"]
"tests/test_throughput_improvements.py" = ["E402"]
"tests/test_timing_enhancements.py" = ["E402"]

[tool.mypy]
exclude = ['(?i)^tmp/', '(?i)^artifacts/', '(?i)^\\.agent/']
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
